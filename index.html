<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="바이브 카페 음료 주문서">
    <title>바이브 카페 주문서</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="brand-mark" aria-hidden="true">☕</div>
        <div>
            <p class="brand-name">바이브 카페</p>
            <p class="brand-subtitle">당신의 하루에 바이브를 더하다</p>
        </div>
    </header>

    <main>
        <form id="orderForm" novalidate>
            <div class="form-field">
                <label for="customerName">이름 <span aria-hidden="true">*</span></label>
                <input id="customerName" name="customerName" type="text" autocomplete="name" required placeholder="이름을 입력하세요">
            </div>

            <div class="form-field">
                <label for="phoneNumber">전화번호</label>
                <input id="phoneNumber" name="phoneNumber" type="tel" autocomplete="tel" placeholder="010-XXXX-XXXX">
            </div>

            <div class="form-field">
                <label for="drink">음료 선택 <span aria-hidden="true">*</span></label>
                <select id="drink" name="drink" required>
                    <option value="">-- 음료를 선택하세요 --</option>
                    <option value="아메리카노" data-price="3500">아메리카노 3,500원</option>
                    <option value="카페라떼" data-price="4000">카페라떼 4,000원</option>
                    <option value="카페모카" data-price="4500">카페모카 4,500원</option>
                    <option value="바닐라라떼" data-price="4500">바닐라라떼 4,500원</option>
                    <option value="녹차라떼" data-price="4500">녹차라떼 4,500원</option>
                </select>
            </div>

            <fieldset class="form-field">
                <legend>사이즈</legend>
                <label for="sizeS"><input id="sizeS" name="size" type="radio" value="S" data-price="0">S <span>+0원</span></label>
                <label for="sizeM"><input id="sizeM" name="size" type="radio" value="M" data-price="500" checked>M <span>+500원</span></label>
                <label for="sizeL"><input id="sizeL" name="size" type="radio" value="L" data-price="1000">L <span>+1,000원</span></label>
            </fieldset>

            <fieldset class="form-field">
                <legend>추가 옵션</legend>
                <label for="shot"><input id="shot" name="shot" type="checkbox" value="샷 추가" data-price="500">샷 추가 <span>+500원</span></label>
                <label for="cream"><input id="cream" name="cream" type="checkbox" value="크림 추가" data-price="500">크림 추가 <span>+500원</span></label>
                <label for="syrup"><input id="syrup" name="syrup" type="checkbox" value="시럽 추가" data-price="300">시럽 추가 <span>+300원</span></label>
                <label for="decaf"><input id="decaf" name="decaf" type="checkbox" value="디카페인" data-price="0">디카페인 <span>+0원</span></label>
            </fieldset>

            <div class="form-field">
                <label for="quantity">수량</label>
                <input id="quantity" name="quantity" type="number" min="1" max="10" value="1" required>
            </div>

            <div class="form-field">
                <label for="request">요청사항</label>
                <textarea id="request" name="request" rows="4" placeholder="원하는 맛, 온도, 레시피 등을 입력하세요"></textarea>
            </div>

            <div class="amount-area" aria-live="polite">
                <span>예상 금액:</span>
                <strong id="estimatedAmount">0원</strong>
            </div>

            <button id="submitButton" type="submit">주문하기</button>
            <button type="reset">다시 작성</button>

            <div id="orderConfirmation" class="order-confirmation" role="status" aria-live="polite" hidden></div>
            <p id="orderError" class="order-error" role="alert" hidden></p>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
