<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바이브 카페 주문서</title>

    <!-- 스타일시트 연결: 디자인은 나중에 style.css에서 작업합니다. -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 페이지 상단에 카페 로고와 제목을 배치합니다. -->
    <header class="site-header">
        <div class="brand-mark" aria-hidden="true">☕</div>
        <div>
            <p class="brand-name">바이브 카페</p>
            <p class="brand-subtitle">당신의 하루에 바이브를 더하다</p>
        </div>
    </header>

    <main>
        <!-- form에 novalidate를 넣어 이름 필수 검사를 JavaScript가 담당하도록 합니다. -->
        <form id="orderForm" novalidate>
            <!-- 이름 입력 영역 -->
            <div class="form-field">
                <label for="customerName">이름 <span aria-hidden="true">*</span></label>
                <input
                    id="customerName"
                    name="customerName"
                    type="text"
                    autocomplete="name"
                    placeholder="이름을 입력하세요"
                    required
                >
            </div>

            <!-- 전화번호 입력 영역 -->
            <div class="form-field">
                <label for="phoneNumber">전화번호</label>
                <input
                    id="phoneNumber"
                    name="phoneNumber"
                    type="tel"
                    autocomplete="tel"
                    placeholder="010-XXXX-XXXX"
                >
            </div>

            <!-- 음료 선택 드롭다운 -->
            <div class="form-field">
                <label for="drink">음료 선택 <span aria-hidden="true">*</span></label>
                <select id="drink" name="drink" required>
                    <option value="">-- 음료를 선택하세요 --</option>
                    <option value="아메리카노" data-price="3500">아메리카노 3,500원</option>
                    <option value="카페라떼" data-price="4000">카페라떼 4,000원</option>
                    <option value="카페모카" data-price="4500">카페모카 4,500원</option>
                    <option value="바닐라라떼" data-price="4500">바닐라라떼 4,500원</option>
                    <option value="녹차라떼" data-price="4500">녹차라떼 4,500원</option>
                </select>
            </div>

            <!-- 사이즈 선택 라디오 -->
            <fieldset class="form-field">
                <legend>사이즈</legend>
                <label for="sizeS">
                    <input id="sizeS" name="size" type="radio" value="S" data-price="0">
                    S <span>+0원</span>
                </label>
                <label for="sizeM">
                    <input id="sizeM" name="size" type="radio" value="M" data-price="500" checked>
                    M <span>+500원</span>
                </label>
                <label for="sizeL">
                    <input id="sizeL" name="size" type="radio" value="L" data-price="1000">
                    L <span>+1,000원</span>
                </label>
            </fieldset>

            <!-- 추가 옵션 체크박스 -->
            <fieldset class="form-field">
                <legend>추가 옵션</legend>
                <label for="shot">
                    <input id="shot" name="shot" type="checkbox" value="샷 추가" data-price="500">
                    샷 추가 <span>+500원</span>
                </label>
                <label for="cream">
                    <input id="cream" name="cream" type="checkbox" value="크림 추가" data-price="500">
                    크림 추가 <span>+500원</span>
                </label>
                <label for="syrup">
                    <input id="syrup" name="syrup" type="checkbox" value="시럽 추가" data-price="300">
                    시럽 추가 <span>+300원</span>
                </label>
                <label for="decaf">
                    <input id="decaf" name="decaf" type="checkbox" value="디카페인" data-price="0">
                    디카페인 <span>+0원</span>
                </label>
            </fieldset>

            <!-- 수량 입력 영역 -->
            <div class="form-field">
                <label for="quantity">수량</label>
                <input
                    id="quantity"
                    name="quantity"
                    type="number"
                    min="1"
                    max="10"
                    value="1"
                >
            </div>

            <!-- 요청사항 textarea 영역 -->
            <div class="form-field">
                <label for="request">요청사항</label>
                <textarea
                    id="request"
                    name="request"
                    rows="4"
                    placeholder="원하는 맛, 온도, 레시피 등을 입력하세요"
                ></textarea>
            </div>

            <!-- 예상 금액 표시: 주문하기 버튼 바로 위에 배치합니다. -->
            <div class="amount-area" aria-live="polite">
                <span>예상 금액:</span>
                <strong id="estimatedAmount">0원</strong>
            </div>

            <!-- 주문하기 버튼 -->
            <button type="submit">주문하기</button>

            <!-- 다시 작성 버튼 -->
            <button type="reset">다시 작성</button>

            <!-- 주문 확인 메시지가 나올 빈 영역: 처음에는 숨김 상태입니다. -->
            <div id="orderConfirmation" role="status" aria-live="polite" hidden>
                주문이 확인되었습니다.
            </div>
        </form>
    </main>

    <!-- Supabase JavaScript v2를 먼저 불러와 클라이언트 객체를 사용할 수 있게 합니다. -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- 주문서 기능을 담당하는 JavaScript 파일을 불러옵니다. -->
    <script src="script.js"></script>
</body>
</html>
